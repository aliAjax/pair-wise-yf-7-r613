<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>活字排版工坊</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">本地活字印章排版 · 双开班次</p>
          <h1>活字排版工坊</h1>
        </div>
        <div class="shift-bar" aria-label="班次编排">
          <div class="shift-meta">
            <span>班次 <strong id="shiftIdLabel">—</strong></span>
            <span>基线 <strong id="baseRevLabel">0</strong></span>
            <span>头版 <strong id="headRevLabel">0</strong></span>
            <span id="shiftStatus" class="badge ok">编辑中</span>
          </div>
          <div class="shift-actions">
            <button id="newWindowBtn" type="button" title="再开一个窗口领一份新班次，两人同时改同一张版">新开窗口</button>
            <button id="commitShiftBtn" class="primary" type="button">提交班次</button>
          </div>
        </div>
      </header>

      <section class="settings-bar" aria-label="版面设置">
        <label>
          纸张
          <select id="paperSize">
            <option value="postcard">明信片</option>
            <option value="bookmark">书签</option>
            <option value="square">方形小笺</option>
          </select>
        </label>
        <label>
          方向
          <select id="flowMode">
            <option value="horizontal">横排</option>
            <option value="vertical">竖排</option>
          </select>
        </label>
        <label>
          网格
          <input id="gridGap" type="range" min="4" max="18" value="8" />
        </label>
        <label>
          作品名
          <input id="workTitle" type="text" placeholder="例：晚风小笺" />
        </label>
        <p class="shift-hint">落字与数量改动都记在本班次，提交后才进头版；草稿与导出只认已确认班次。</p>
      </section>

      <section class="workspace">
        <aside class="panel inventory-panel">
          <div class="panel-head">
            <h2>字模库</h2>
            <span id="inventoryCount"></span>
          </div>
          <form id="typeForm" class="type-form">
            <input id="charInput" maxlength="2" placeholder="字" required />
            <input id="styleInput" placeholder="风格" required />
            <input id="sizeInput" type="number" min="8" max="72" value="24" required />
            <input id="quantityInput" type="number" min="1" max="99" value="3" required />
            <select id="wearInput">
              <option value="新">新</option>
              <option value="微磨">微磨</option>
              <option value="旧痕">旧痕</option>
            </select>
            <button class="primary" type="submit">加入</button>
          </form>
          <div class="filter-row">
            <input id="inventorySearch" type="search" placeholder="搜索字或风格" />
            <select id="styleFilter">
              <option value="all">全部风格</option>
            </select>
          </div>
          <div id="typeList" class="type-list"></div>
        </aside>

        <section class="stage-wrap">
          <div id="conflictBanner" class="banner conflict" hidden>
            <div class="banner-head">
              <strong>提交冲突：</strong>对方已先写入头版，以下格子两边选了不同字模，请取舍后再提交。
            </div>
            <div id="conflictList" class="conflict-list"></div>
          </div>
          <div id="returnBanner" class="banner warn" hidden>
            <div class="banner-head">
              <strong>班次退回：</strong>头版字模数量已更新，本班次以下用量超限，请调整后再提交。
            </div>
            <ul id="returnReasons" class="return-reasons"></ul>
          </div>
          <div class="status-strip">
            <div>
              <strong id="selectedTypeLabel">未选择字模</strong>
              <span>点击字模后，在版面格子中落字，也可拖拽字模到版面。虚线格为本班次未提交的落字。</span>
            </div>
            <div id="shortageBadge" class="badge ok">数量充足</div>
          </div>
          <div id="stage" class="stage" aria-label="排版画布"></div>
        </section>

        <aside class="panel draft-panel">
          <div class="panel-head">
            <h2>草稿与核对</h2>
            <span id="placedCount"></span>
          </div>
          <div id="usageList" class="usage-list"></div>
          <div class="divider"></div>
          <div class="draft-save-row">
            <button id="saveDraftBtn" type="button">保存草稿</button>
            <button id="exportBtn" type="button">导出预览图</button>
            <button id="clearBoardBtn" type="button">清空版面</button>
          </div>
          <h3>已保存草稿</h3>
          <div id="draftList" class="draft-list"></div>
        </aside>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
